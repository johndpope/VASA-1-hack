# VASA Configuration
defaults:
  - _self_



# Model architecture
model:
  hidden_dim: 512
  n_heads: 8
  n_layers: 8
  dim_feedforward: 2048
  dropout: 0.1
  expression_dim: 128  # Expression embedding dimension from volumetric avatar
  # Add these:
  condition_embedding_dim: 512  # Dimension for condition embeddings
  use_prev_motion: true        # Whether to use previous motion context
  max_motion_length: 1000      # Maximum motion sequence length
  use_relative_position: true  # Use relative position encoding



# Diffusion parameters
diffusion:
  num_steps: 1000
  beta_start: 1e-4
  beta_end: 0.02
  cfg_start_epoch: 0  # When to start using CFG
  cfg_ramp_epochs: 10  # Epochs to ramp up CFG scales

  schedule_mode: 'cosine'  # One of: linear, quadratic, sigmoid, cosine
  schedule_s: 0.008  # Schedule parameters (for cosine schedule)

# Motion generation parameters
motion:
  num_speed_buckets: 9
  window_size: 50              # Original window size
  stride: 25                   # Original stride
  context_size: 10             # Original context size
  overlap_smooth: true

  smooth_window: 5             # Temporal smoothing window size
  use_motion_prior: true       # Whether to use motion prior

  warmup_steps: 500          # Extended warmup for VASA-1 alignment
  scheduler:
    type: "cosine"            # Learning rate scheduler type
    min_lr: 5e-5              # Increased minimum LR to prevent decay too low
    warmup_ratio: 0.1         # Extended warmup ratio for stability
  
  # Progressive training
  progressive:
    enabled: true
    start_sequence_length: 15
    max_sequence_length: 50
    length_increase_freq: 5    # Epochs between increases
    
  # Mixed precision training
  amp: true                   # Whether to use automatic mixed precision
  scaler_growth: 2.0          # Gradient scaler growth rate

# Training parameters
train:
  resume_from: "" # Set to checkpoint path to resume training
  # when to add conditional signals
  control_start_epoch: 0 # 👹 this should be 1 or 0 for large video datasets with smaller epochs


  lr: 5e-3 # Increased base learning rate for faster convergence
  motion_proj_lr: 0.5 # Increased motion projection LR multiplier
  expression_lr: 0.5   # Increased expression LR multiplier 

  turn_off_noise: false # no noise signal / no drop out
  learning_rates:
    condition_embedding: 1e-3  # 5x increase
    motion_projections: 5e-4   # 5x increase
    transformer_early: 7.5e-4  # 5x increase
    transformer_late: 2.5e-4   # 5x increase
    output_projections: 1e-3   # 5x increase

  batch_size: 4                # Back to 4 with larger dataset
  windows_per_batch: 64         # Number of consecutive windows per sequence  
  gradient_accumulation_steps: 4  # Effective batch size of 16
  num_epochs: 1000            # Reduced for quick testing

  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.01
  max_grad_norm: 1.0
  save_freq: 10               # Save more frequently for overfitting test
  
  # Dropout probabilities for CFG - VASA-1 uses different rates for prev_ vs current
  dropout_probs:
    # Current conditions (0.1 dropout per paper)
    audio: 0.1                # Paper default: 0.1 for general conditions
    gaze: 0.1
    head_distance: 0.1
    emotion: 0.1
    
    # Previous context conditions (0.5 dropout per paper for robustness)
    prev_audio: 0.5           # Paper: 0.5 for previous audio context
    prev_theta: 0.5           # Paper: 0.5 for previous motion
    prev_rotation: 0.5        # Paper: 0.5 for previous motion
    prev_translation: 0.5     # Paper: 0.5 for previous motion
    prev_expression: 0.5      # Paper: 0.5 for previous dynamics

  # CFG scales schedule (aligned with VASA-1 paper)
  cfg_scales:
    audio: 0.5      # Paper default: 0.5 (was 3.0)
    gaze: 1.0
    head_distance: 0.8
    emotion: 0.5

  # Gradient monitoring
  gradient_monitoring:
    enabled: true
    log_freq: 100  # Steps between gradient logs
    save_grad_norms: true
    save_grad_flows: true
    num_layers_to_monitor: 8  # Number of transformer layers to track


    
    

# Loss weights - TDD PROGRESSIVE SYSTEM
loss:
  # Use TDD progressive loss system
  use_tdd_progressive: true
  
  expression_weighting:
    enabled: true
    min_weight: 0.5
  # Adaptive loss weighting
  use_adaptive_weighting: true
  adaptive_update_freq: 100   # Update weights every N steps  # Minimum weight for least important dimensions
    
  use_sync_loss: false
  use_verification: false      # Disable verification to save memory
  lambda_verification: 0       # Disable verification to save memory
  
  lambda_lips: 0.5    # Weight for lip motion loss
  lambda_nonlip: 0.1   # Weight for non-lip facial landmarks
  lambda_speed: 0.1
  lambda_pose: 1.0
  lambda_dynamics: 5.0  # Reduced expression weight for stability
  lambda_reconstruction: 1.0
  # Audio-visual sync loss
  lambda_sync: 0.0     # Disabled - SyncNet for evaluation only 

  
  # Control signal adherence loss
  lambda_control: 0.3 # 🌻 circle back and fix thiss
  lambda_lip: 1.0

  lambda_gaze_direction: 0.2
  lambda_head_distance: 0.2
  lambda_emotion: 0.3

  lambda_cfg: 0.5
  lambda_perceptual: 0.5      # Increased perceptual loss for better quality
  lambda_temporal: 0.8        # Temporal consistency
  use_consistency: true       # Enable VASA consistency loss
  use_identity: true          # Enable face identity preservation
  lambda_consistency: 0.5     # Weight for consistency loss
  lambda_identity: 0.3        # Weight for identity loss
  
  # NEW VASA-1 inspired losses
  use_score_matching: true    # Use VASA-1 style clean signal prediction (not noise)
  lambda_consist: 1.0         # Pairwise transfer loss for disentanglement
  lambda_cross_id: 0.1        # Cross-identity similarity loss
  lambda_velocity: 1.0        # Velocity matching regularization (GREATLY increased to enforce motion)
  lambda_smoothness: 0.01     # Acceleration smoothness regularization (increased for temporal consistency)
  
  # Disentanglement loss configuration
  disentangle_num_pairs: 2           # Reduced pairs to save computation
  disentangle_sampling: 'extremes'   # Use first and last only
  disentangle_compute_freq: 10       # Compute less frequently
  disentangle_vis_freq: 500          # Visualize less frequently
  cross_id_num_frames: 2             # Fewer frames for identity
  cross_id_normalize: true           # Normalize frames before identity extraction
  
  # High-res identity extraction settings
  identity_highres_scale: 2           # Upscale factor before identity extraction
  identity_sharpening_alpha: 0.5     # Sharpening strength (0-1)
  identity_use_antialias: true       # Use antialiasing for downsampling
  
  # Frame generation for disentanglement losses
  use_sparse_frames: true     # Generate only sparse frames to save memory
  
  warmup_epochs: 0            # Loss warmup epochs - for many videos dont worry
  
    # Blink control loss
  lambda_blink: 0.5  # Weight for blink state control
  
  # Loss scheduling
  schedule:
    enabled: true
    start_epoch: 5
    rampup_epochs: 10


  blink:
    start_weight: 0.1
    final_weight: 0.5
# Inference parameters
inference:
  batch_size: 1
  cfg_scale: 0.5  # Global scale (legacy, use cfg_scales below for per-condition)
  # Per-condition CFG scales for inference (can override train values)
  cfg_scales:
    audio: 0.5      # Paper default: 0.5
    gaze: 1.0       # Paper default: 1.0
    head_distance: 0.8
    emotion: 0.5
  eta: 0.5  # Increased from 0.0 for stochasticity to prevent static output
  output_size: [512, 512]
  num_inference_steps: 50    # Number of DDIM steps
  temperature: 1.0            # Sampling temperature
  top_k: 50                   # Top-k sampling parameter
  top_p: 0.9                 # Nucleus sampling parameter
  use_window_cache: true     # Cache window computations

# Dataset parameters
dataset:
  sequence_length: 25          # Back to original for window_size 50
  frame_size: [512, 512]
  preextract_audio: true
  cache_audio: true
  hop_length: 10
  max_videos: 100              # Using subset of CelebV-HQ dataset
  min_sequence_length: 15     # Minimum sequence length
  max_sequence_samples: 500   # Limit samples per epoch
  use_identity_image: false   # Set to true to use high-quality identity image
  identity_image_path: "nemo/data/IMG_1.png"  # Path to high-quality identity image
  augmentation:
    enabled: false             # Disable augmentation initially for stability
    flip_prob: 0.5
    temporal_crop_prob: 0.3
    intensity_scale: 0.2
    temporal_mask_prob: 0.1
# Model checkpoint paths
paths:
  checkpoint_dir: "checkpoints"
  syncnet_path: "pretrained/syncnet.pth"
  emotion_model: "pretrained/emonet.pth"
  volumetric_model: "nemo/logs/Retrain_with_17_V1_New_rand_MM_SEC_4_drop_02_stm_10_CV_05_1_1/checkpoints/328_model.pth"
  volumetric_config: "nemo/models/stage_1/volumetric_avatar/va.yaml"
  data_dir: "data"
  video_folder: "/media/12TB/Downloads/CelebV-HQ/celebvhq/35666"
  cache_dir: "cache"


# Hardware/environment settings
device: "cuda"
seed: 123  # Changed seed to get different random video selection
num_workers: 4                # Reduced to prevent memory issues
debug: false
wandb:
  project: "vasa"
  enabled: true

# Additional components
face_analysis:
  face_detector: "retinaface"
  face_parser: "rtnet"
  emotion_recognizer: "hsemotion"
  
audio:
  sample_rate: 16000
  feature_type: "wav2vec2"
  feature_dim: 768
  normalize_audio: true

# Visualization settings
vis:
  save_videos: true
  save_frames: false
  vis_freq: 25
  num_vis_samples: 4


# Logging configuration
logging:
  level: "INFO"
  save_frequency: 100        # Steps between logging
  metrics:
    save_predictions: true
    compute_fid: true
    compute_kid: true

  # Validation
  validation:
    frequency: 1            # Epochs between validation
    num_samples: 100        # Number of validation samples
    metrics: ["lip_sync", "id_similarity", "motion_naturalness"]

# Distributed training
distributed:
  enabled: true
  backend: "nccl"
  find_unused_parameters: false
  gradient_as_bucket_view: true

# Optimization settings
optimization:
  compile_model: false      # Whether to use torch.compile
  channels_last: true       # Use channels_last memory format
  gradient_checkpointing: true  # Enable to save memory
  sync_batchnorm: true 
