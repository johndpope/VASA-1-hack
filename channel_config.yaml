model:
  model_dim: 512
  max_seq_len: 60
  clip_bounds:
    min: -100.0
    max: 100.0

dimensions:
  prev_expression: 64
  prev_audio: 64
  audio_features: 475  # Adjusted to fit within channel layout

landmarks:
  lips:
    points: 20
    coords: 3
  right_eye:
    points: 8
    coords: 3
  left_eye:
    points: 7
    coords: 3
  jaw:
    points: 10
    coords: 3
  nose:
    points: 4
    coords: 3

channel_layout:
  # Dedicated channels for each condition type
  # Total must not exceed model_dim (512)

  # Current window conditions
  audio_features:
    size: 475  # Reduced to leave room for other features (512 - 37 = 475)
    description: "Current audio features from wav2vec (projected)"

  gaze:
    size: 2  # pitch and yaw
    description: "Gaze direction angles"

  head_distance:
    size: 1
    description: "Head distance from camera"

  emotion:
    size: 2  # valence and arousal
    description: "Emotion parameters"

  blink_state:
    size: 32
    description: "Blink state embedding"

  # Total: 475 + 2 + 1 + 2 + 32 = 512 (exactly fits model_dim)

# Audio model dimensions 
audio_models:
  wav2vec:
    input_dim: 768
    hidden_dim: 256
    output_dim: ${dimensions.audio_features}
  whisper:
    input_dim: 384  
    hidden_dim: 256  
    output_dim: ${dimensions.audio_features}

# Reference whichever model you want to use
projections:
  audio: ${audio_models.wav2vec}  # Change to wav2vec to use wav2vec features
  
  blink:
    input_dim: 3  
    hidden_dim: 32
    output_dim: 32
    
  motion_norm_dim: 256
  control_norm_dim: 5  # Updated from 6 to 5 (removed speed_bucket: gaze:2 + distance:1 + emotion:2)
  landmark_norm_dim: ${sum:${landmarks.lips.points}*${landmarks.lips.coords},
                          ${landmarks.right_eye.points}*${landmarks.right_eye.coords},
                          ${landmarks.left_eye.points}*${landmarks.left_eye.coords},
                          ${landmarks.jaw.points}*${landmarks.jaw.coords},
                          ${landmarks.nose.points}*${landmarks.nose.coords}} 
